# Local sandbox only. Not production. Not client 0.
# Production is evorove.com + api.evorove.com in one Railway project.
# acme-home-services and run-e2e.sh are a fixture walk, not a live sale.
#
#   cd system && ./run-e2e.sh
#
# Sister repos are expected next to this one (~/dev/evorove, ~/dev/evorove-crm,
# ~/dev/evorove_lead). Override with CRM_DIR / LEAD_DIR if yours differ.
# Local-only values below; never reuse them in a deployment.

x-secret: &secret
  INTERNAL_TASK_SECRET: ${INTERNAL_TASK_SECRET:-local_development_only}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evorove
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: evorove
    ports:
      - "${SYSTEM_POSTGRES_PORT:-5440}:5432"
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evorove -d evorove"]
      interval: 5s
      timeout: 5s
      retries: 20

  engine:
    build:
      context: ..
    environment:
      <<: *secret
      DATABASE_URL: postgresql+psycopg://evorove:local_development_only@postgres:5432/engine
      APP_ENV: development
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      CRM_BASE_URL: http://crm:8000
      # Owner sets these. Empty means cold email refuses to send.
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      ACCOUNT_SECURITY_ENCRYPTION_KEY: ${ACCOUNT_SECURITY_ENCRYPTION_KEY:-}
    command: sh -c "alembic upgrade head && python examples/seed_example_business.py && exec uvicorn src.api.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "${ENGINE_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ./:/system:ro
    depends_on:
      postgres:
        condition: service_healthy

  crm:
    build:
      context: ${CRM_DIR:-../../evorove-crm}
    environment:
      <<: *secret
      DATABASE_URL: postgresql+psycopg://evorove:local_development_only@postgres:5432/crm
      APP_ENV: development
      AI_PROVIDER: deterministic
      EVOROVE_BASE_URL: http://engine:8000
      EVOROVE_LEAD_BASE_URL: http://lead:8002
    command: sh -c "alembic upgrade head && python examples/seed_example_business.py && exec uvicorn src.api.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "${CRM_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy

  lead:
    build:
      context: ${LEAD_DIR:-../../evorove_lead}
    environment:
      <<: *secret
      DATABASE_URL: postgresql+psycopg://evorove:local_development_only@postgres:5432/lead
      CRM_BASE_URL: http://crm:8000
      # Same business id as the engine and the CRM. Owner types it. Empty is not a search.
      EVOROVE_CLIENT_ZERO_BUSINESS_ID: ${EVOROVE_CLIENT_ZERO_BUSINESS_ID:-}
      WEB_SEARCH_BASE_URL: ${WEB_SEARCH_BASE_URL:-}
      AI_PROVIDER: ${LEAD_AI_PROVIDER:-deterministic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    ports:
      - "${LEAD_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/openapi.json')"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ./fixtures:/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
