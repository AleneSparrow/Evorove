<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1080px; }
  body { background:#F4EEDF; font-family:'Inter',sans-serif; position:relative; overflow:hidden; }
  .logo { position:absolute; top:64px; left:64px; display:flex; align-items:center; gap:14px; }
  .dot { width:56px; height:56px; border-radius:50%; background:#FF5A2B; display:flex; align-items:center; justify-content:center; }
  .dot::after { content:''; width:20px; height:20px; border-radius:50%; background:#141210; }
  .wordmark { font-family:'Anton',sans-serif; font-size:30px; letter-spacing:2px; color:#141210; }
  .headline { position:absolute; left:64px; top:340px; right:64px; }
  .line1 { font-family:'Anton',sans-serif; font-size:74px; line-height:1.05; color:#141210; }
  .line2 { font-family:'Anton',sans-serif; font-size:74px; line-height:1.05; color:#FF5A2B; }
  .body { position:absolute; left:64px; bottom:110px; right:280px; font-size:24px; line-height:1.4; color:#5b5548; }
  .tag { position:absolute; right:64px; bottom:104px; background:#D4E94A; color:#141210; font-family:'Anton',sans-serif; font-size:20px; letter-spacing:1px; padding:10px 18px; white-space:nowrap; }
</style>
</head>
<body>
  <div class="logo">
    <div class="dot"></div>
    <div class="wordmark">EVOROVE</div>
  </div>
  <div class="headline">
    <div class="line1">NOT A CHAT</div>
    <div class="line2">WINDOW.</div>
  </div>
  <div class="body">A conversation is the channel. The product is the cycle: qualify, follow up, book. Dead air is a bug.</div>
  <div class="tag">INQUIRY &rarr; JOB</div>
</body>
</html>
